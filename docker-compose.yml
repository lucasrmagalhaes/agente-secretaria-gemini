services:
  secretaria-mcp:
    build: .
    image: agente-secretaria-mcp
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3333"
      MCP_PATH: /mcp
    volumes:
      - ./secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Para o n8n em outro compose enxergar este servico pelo nome secretaria-mcp,
# crie uma rede compartilhada e ligue os dois. Exemplo, se a rede do n8n se chama n8n_default:
